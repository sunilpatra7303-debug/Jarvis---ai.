<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}:root{color-scheme:dark;--cyan:#55eaff;--blue:#168dff;--muted:#8ba9c6}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#10294a 0,#071326 42%,#030711 100%);color:#eaf8ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.app{min-height:100vh;max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 22px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:10px;letter-spacing:2px}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:2px;margin-top:3px}.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--cyan);box-shadow:0 0 15px var(--cyan)}.state{font-size:9px;color:#75f5ce;letter-spacing:1px;white-space:nowrap}
.core-wrap{height:340px;position:relative;display:grid;place-items:center;margin:20px 0 4px}.orbit{position:absolute;border:1px solid #36cfff55;border-radius:50%;transform:rotate(-25deg)}.orbit-a{width:260px;height:260px;border-top-color:var(--cyan);border-bottom-color:#168dff}.orbit-b{width:220px;height:290px;border-left:2px solid #55eaff99;border-right:2px solid #168dff88;transform:rotate(58deg)}.core{width:172px;height:172px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#1d5c82 0,#0a2442 48%,#061426 70%);border:2px solid #65eaff;box-shadow:0 0 18px #1aaeff,inset 0 0 28px #168dff88;animation:pulse 3s infinite}.core-inner{width:130px;height:130px;border:1px solid #63dfff99;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px}.core-mark{font-size:62px;font-weight:200;color:#baf8ff;text-shadow:0 0 20px var(--cyan);line-height:1}.core-inner small{font-size:9px;letter-spacing:4px;color:var(--cyan)}.core-caption{position:absolute;bottom:10px;color:var(--cyan);font-size:10px;letter-spacing:3px;text-align:center}
@keyframes pulse{50%{box-shadow:0 0 34px #1aaeff,inset 0 0 40px #168dffbb;transform:scale(1.025)}}
.conversation{border:1px solid #2e78a455;background:#061326aa;border-radius:15px;padding:15px;min-height:105px;max-height:180px;overflow:auto}.tag{font-size:9px;letter-spacing:2px;color:var(--cyan);font-weight:700}.assistant-line p,.user-line p{margin:5px 0 12px;font-size:14px;line-height:1.5}.user-line p{color:#c3d9ef}.controls{display:flex;flex-direction:column;align-items:center;margin-top:20px}.controls label{font-size:9px;letter-spacing:2px;color:var(--muted);margin-bottom:7px}select{background:#091b31;color:#dffaff;border:1px solid #287fa5;border-radius:8px;padding:9px 20px;font-size:13px}.mic{margin-top:18px;width:78px;height:78px;border-radius:50%;border:2px solid var(--cyan);background:radial-gradient(circle,#174d72,#07182d 70%);color:white;box-shadow:0 0 22px #16baff77;font-size:27px}.mic.listening{background:#5c1830;border-color:#ff6b9c;box-shadow:0 0 25px #ff397c}.hint{font-size:9px;letter-spacing:3px;color:var(--cyan);margin:10px 0 16px}.manual{display:flex;width:100%;gap:8px}.manual input{flex:1;min-width:0;background:#07172a;border:1px solid #2b6b91;border-radius:9px;padding:12px;color:white;font-size:14px}.manual button{background:#0d4569;border:1px solid var(--cyan);border-radius:9px;color:white;padding:0 16px;font-size:11px;letter-spacing:1px}footer{display:flex;justify-content:space-between;color:#587a99;font-size:8px;letter-spacing:1.2px;margin-top:auto;padding-top:22px}
@media(max-height:700px){.core-wrap{height:260px}.core{width:145px;height:145px}.orbit-a{width:220px;height:220px}.orbit-b{height:240px;width:180px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><span class="brand-dot"></span><div><b>J.A.R.V.I.S.</b><small>PERSONAL AI SYSTEM</small></div></div><span id="systemState" class="state">● SYSTEM READY</span></header>
<section class="core-wrap" aria-label="JARVIS status"><div class="orbit orbit-a"></div><div class="orbit orbit-b"></div><div class="core"><div class="core-inner"><span class="core-mark">J</span><small>JARVIS</small></div></div><div class="core-caption" id="statusText">AWAITING COMMAND</div></section>
<section class="conversation"><div class="assistant-line"><span class="tag">JARVIS</span><p id="reply">Hello! I am ready. Tap the microphone and speak to me.</p></div><div class="user-line" id="userLine" hidden><span class="tag">YOU</span><p id="heardText"></p></div></section>
<section class="controls"><label for="language">VOICE LANGUAGE</label><select id="language"><option value="hi-IN">Hindi</option><option value="en-IN">English</option><option value="or-IN">Odia</option></select><button id="micButton" class="mic" aria-label="Start voice input">🎙</button><div class="hint" id="hint">TAP TO SPEAK</div><div class="manual"><input id="messageInput" type="text" placeholder="Type a command..." autocomplete="off"><button id="sendButton">SEND</button></div></section>
<footer><span>VOICE • INTELLIGENCE • AUTOMATION</span><span>BUILD 0.1</span></footer>
</main>
<script>
const $=id=>document.getElementById(id),micButton=$("micButton"),language=$("language");let busy=false;
const phrases={
hi:{hello:"Namaste! Main JARVIS hoon. Abhi mera demo mode chal raha hai. Real AI brain agle step mein connect karenge.",time:"Main abhi phone ka exact time access nahi kar raha. Apne phone ke status bar mein time dekh sakte hain.",help:"Aap mujhse Hindi, English ya Odia mein baat kar sakte hain. Abhi voice input aur demo replies available hain."},
en:{hello:"Hello! I am JARVIS. Demo mode is active. We will connect the real AI brain in the next step.",time:"I do not have live device data connected yet. Please check your phone clock.",help:"You can speak to me in Hindi, English or Odia. Voice input and demo replies are available now."},
or:{hello:"ନମସ୍କାର! ମୁଁ JARVIS। ବର୍ତ୍ତମାନ ଡେମୋ ମୋଡ୍ ଚାଲୁଛି। ପରବର୍ତ୍ତୀ ପଦକ୍ଷେପରେ ଆମେ AI କନେକ୍ଟ କରିବା।",time:"ମୋ ପାଖରେ ଏପର୍ଯ୍ୟନ୍ତ ଫୋନ୍‌ର ସମୟ ତଥ୍ୟ ନାହିଁ।",help:"ଆପଣ ମୋ ସହିତ ହିନ୍ଦୀ, ଇଂରାଜୀ କିମ୍ବା ଓଡ଼ିଆରେ କଥା ହୋଇପାରିବେ।"}
};
function groupFor(t){if(/[଀-୿]/.test(t))return"or";if(/[ऀ-ॿ]/.test(t))return"hi";return language.value==="or-IN"?"or":language.value==="hi-IN"?"hi":"en"}
function status(t,s="ready"){$("statusText").textContent=t.toUpperCase();$("systemState").textContent=s==="listening"?"● LISTENING":s==="thinking"?"● PROCESSING":"● SYSTEM READY"}
function speak(t,lang=language.value){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;u.rate=.95;speechSynthesis.speak(u)}
function replyTo(t){let g=groupFor(t),l=t.toLowerCase(),a;if(/hello|hi jarvis|hey jarvis|नमस्ते|हेलो|ନମସ୍କାର/i.test(l))a=phrases[g].hello;else if(/time|समय|କେତେ ବାଜିଲା/i.test(l))a=phrases[g].time;else if(/help|मदद|ସାହାଯ୍ୟ/i.test(l))a=phrases[g].help;else a=g==="hi"?"Maine aapki baat sun li: "+t+". Abhi main demo mode mein hoon. Real AI connect karne ke baad iska intelligent jawab dunga.":g==="or"?"ମୁଁ ଆପଣଙ୍କ କଥା ଶୁଣିଲି: "+t+"। ମୁଁ ଏବେ ଡେମୋ ମୋଡ୍‌ରେ ଅଛି।":"I heard: "+t+". I am in demo mode for now. We will connect the full AI brain next.";$("heardText").textContent=t;$("userLine").hidden=false;$("reply").textContent=a;status("Speaking","thinking");speak(a);setTimeout(()=>status("Awaiting command"),700)}
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("reply").textContent="Speech recognition is unavailable in this browser. Try updated Chrome, or use the text box.";return}if(busy)return;let r=new SR();r.lang=language.value;r.interimResults=false;r.maxAlternatives=1;r.onstart=()=>{busy=true;micButton.classList.add("listening");$("hint").textContent="LISTENING...";status("Listening","listening")};r.onresult=e=>replyTo(e.results[0][0].transcript);r.onerror=e=>$("reply").textContent="Microphone error: "+e.error+". Check microphone permission and internet connection.";r.onend=()=>{busy=false;micButton.classList.remove("listening");$("hint").textContent="TAP TO SPEAK";status("Awaiting command")};try{r.start()}catch(e){$("reply").textContent="Could not start microphone. Please try again."}}
micButton.addEventListener("click",listen);$("sendButton").addEventListener("click",()=>{let v=$("messageInput").value.trim();if(v){$("messageInput").value="";replyTo(v)}});$("messageInput").addEventListener("keydown",e=>{if(e.key==="Enter")$("sendButton").click()});language.addEventListener("change,change",()=>{});
language.addEventListener("change",()=>{$("reply").textContent="Voice language set to "+({ "hi-IN":"Hindi","en-IN":"English","or-IN":"Odia"}[language.value])+"."});
</script>
</body>
</html>
