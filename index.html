<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b18">
  <meta name="description" content="Personal multilingual JARVIS assistant">
  <title>JARVIS AI</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand"><span class="brand-dot"></span><div><b>J.A.R.V.I.S.</b><small>PERSONAL AI SYSTEM</small></div></div>
      <span id="systemState" class="state">● SYSTEM READY</span>
    </header>

    <section class="core-wrap" aria-label="JARVIS status">
      <div class="orbit orbit-a"></div><div class="orbit orbit-b"></div>
      <div class="core" id="core"><div class="core-inner"><span class="core-mark">J</span><small>JARVIS</small></div></div>
      <div class="core-caption" id="statusText">AWAITING COMMAND</div>
    </section>

    <section class="conversation">
      <div class="assistant-line">
        <span class="tag">JARVIS</span>
        <p id="reply">Hello! I am ready. Tap the microphone and speak to me.</p>
      </div>
      <div class="user-line" id="userLine" hidden>
        <span class="tag">YOU</span><p id="heardText"></p>
      </div>
    </section>

    <section class="controls">
      <label for="language">VOICE LANGUAGE</label>
      <select id="language">
        <option value="hi-IN">Hindi</option>
        <option value="en-IN">English</option>
        <option value="or-IN">Odia</option>
      </select>
      <button id="micButton" class="mic" aria-label="Start voice input"><span>🎙</span></button>
      <div class="hint" id="hint">TAP TO SPEAK</div>
      <div class="manual">
        <input id="messageInput" type="text" placeholder="Type a command..." autocomplete="off">
        <button id="sendButton">SEND</button>
      </div>
    </section>

    <footer><span>VOICE • INTELLIGENCE • AUTOMATION</span><span>BUILD 0.1</span></footer>
  </main>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(()=>{}));
    }
  </script>
</body>
</html>
